name: Feature request
description: Suggest something sessionsnap should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem or workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like sessionsnap to do
  - type: input
    id: agent
    attributes:
      label: Agent, if it's about one
      description: For a new or changed agent, name it and its version.
