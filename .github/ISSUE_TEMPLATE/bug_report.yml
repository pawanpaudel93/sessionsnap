name: Bug report
description: Something sessionsnap did wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out tokens, keys and the contents of agent sessions.
        Security problems go to a private report instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. sessionsnap save work
        2. ...
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The command's output, ideally with `--json`. Edit out anything private.
      render: shell
  - type: input
    id: version
    attributes:
      label: sessionsnap version
      description: "`sessionsnap --version`"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, cmux and agent versions
      placeholder: macOS 15.6, cmux 0.64.22, Claude Code 2.1.296
    validations:
      required: true
