<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="sessionsnap">
  <!--
    sessionsnap mark: two stacked terminal windows (a snapshot and an older
    version behind it), the front one bookmarked. Three flat colours: ink tile,
    paper windows, amber accent.
    Source for site/favicon.svg and the README logo; keep them identical.
  -->
  <rect x="48" y="48" width="928" height="928" rx="224" fill="#152238"/>

  <!-- the older version, peeking out behind -->
  <rect x="300" y="196" width="540" height="456" rx="72" fill="#F6B73C"/>

  <!-- the current snapshot, cut out from the one behind by an ink gap -->
  <rect x="148" y="300" width="604" height="524" rx="96" fill="#152238"/>
  <rect x="184" y="336" width="532" height="452" rx="64" fill="#F3F5F9"/>

  <!-- shell prompt: >_ -->
  <path d="M276 498l84 64-84 64" fill="none" stroke="#152238" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="396" y="604" width="120" height="46" rx="23" fill="#152238"/>

  <!-- bookmark ribbon hanging from the top edge -->
  <path d="M556 336h104v222l-52-42-52 42z" fill="#F6B73C"/>
</svg>
