[package]
name = "sessionsnap"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Named, versioned snapshots of cmux workspaces and Claude Code sessions"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
