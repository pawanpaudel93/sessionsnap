[package]
name = "sessionsnap"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Named, versioned snapshots of cmux workspaces and coding-agent sessions"
license = "MIT"
repository = "https://github.com/pawanpaudel93/sessionsnap"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Test helpers (`sessionsnap::testing`) for the integration tests; not in release builds.
testing = []

[dev-dependencies]
tempfile = "3"
# The integration tests use the crate's test helpers.
sessionsnap = { path = ".", features = ["testing"] }
