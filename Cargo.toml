[package]
name = "sessionsnap"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Save and resume your coding-agent sessions in cmux and tmux: named, versioned snapshots of workspaces and tabs"
license = "MIT"
repository = "https://github.com/pawanpaudel93/sessionsnap"
homepage = "https://sessionsnap.pawanpaudel.com.np"
documentation = "https://sessionsnap.pawanpaudel.com.np/docs.html"
readme = "README.md"
keywords = ["tmux", "cmux", "claude-code", "codex", "session"]
categories = ["command-line-utilities", "development-tools"]
# The crate is the program: the website, demo, release scripts and CI stay in the repository.
exclude = ["/site", "/assets", "/scripts", "/.github", "/install.sh", "/CLAUDE.md"]

# `cargo binstall sessionsnap` downloads the release tarball (the same one install.sh uses).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sessionsnap-{ version }-{ target }.tar.gz"
bin-dir = "sessionsnap{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/sessionsnap-{ version }-universal-apple-darwin.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/sessionsnap-{ version }-universal-apple-darwin.tar.gz"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Test helpers (`sessionsnap::testing`) for the integration tests; not in release builds.
testing = []

[dev-dependencies]
tempfile = "3"
# The integration tests use the crate's test helpers.
sessionsnap = { path = ".", features = ["testing"] }
