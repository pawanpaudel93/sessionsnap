<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sessionsnap</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <span class="brand">sessionsnap</span>
  <nav class="seg" aria-label="Views">
    <button data-view="list">Snapshots</button>
    <button data-view="recent">Recent</button>
  </nav>
  <span class="spacer"></span>
  <span id="working" class="working" role="status" hidden>Working…</span>
  <button id="refresh" class="icon" title="Refresh" aria-label="Refresh"></button>
</header>
<main id="main" aria-live="polite"></main>
<div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
